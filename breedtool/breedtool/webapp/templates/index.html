<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BreedTool</title>
</head>
<body>
  <h1>PokeMMO Breeding Tree & Cost Calculator</h1>

  <div>
    <h3>Select Stats Needed:</h3>
    <label><input type="checkbox" value="hp" class="iv-check"> HP</label>
    <label><input type="checkbox" value="atk" class="iv-check"> Atk</label>
    <label><input type="checkbox" value="def" class="iv-check"> Def</label>
    <label><input type="checkbox" value="spa" class="iv-check"> SpA</label>
    <label><input type="checkbox" value="spd" class="iv-check"> SpD</label>
    <label><input type="checkbox" value="spe" class="iv-check"> Spe</label>
    <br><br>
    <label><input type="checkbox" id="want-nature"> Lock Nature?</label>
    <br><br>
    <button id="calculate-btn">Calculate Breeding Tree</button>
  </div>

  <pre id="output"></pre>

  <script type="module">
    import { buildTree, costReport, PricingConfig } from './breeding.js';

    let speciesDb = {};

    // 1. Fetch species_db.json from the same directory
    async function init() {
      try {
        const response = await fetch('./species_db.json');
        speciesDb = await response.json();
        console.log("Loaded Species Database:", speciesDb);
      } catch (err) {
        console.error("Could not load species_db.json:", err);
      }
    }

    // 2. Handle Calculation
    document.getElementById('calculate-btn').addEventListener('click', () => {
      const selectedIVs = Array.from(document.querySelectorAll('.iv-check:checked'))
                               .map(cb => cb.value);
      const wantNature = document.getElementById('want-nature').checked;

      try {
        const root = buildTree(selectedIVs, wantNature);
        const report = costReport(root, new PricingConfig(10000, 5000));
        
        document.getElementById('output').textContent = JSON.stringify({
          target: root.traitString(),
          pricingReport: report
        }, null, 2);
      } catch (err) {
        alert(err.message);
      }
    });

    init();
  </script>
</body>
</html>
